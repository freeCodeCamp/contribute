minimumReleaseAge: 10080 # 7 days, in minutes (supply-chain release cooldown)
engineStrict: true
enablePrePostScripts: true
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

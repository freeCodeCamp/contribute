name: 'Setup Node.js and pnpm with caching'
description: 'Sets up Node.js, pnpm, and configures caching for pnpm store'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js and pnpm
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        runtime: node@${{ inputs.node-version }}
        install: false
        cache: true

    - name: Print runtime and store details
      shell: bash
      run: |
        node --version
        pnpm --version
        pnpm store path

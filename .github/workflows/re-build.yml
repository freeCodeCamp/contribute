name: Build

on: [workflow_call]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm, and install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Build project
        run: pnpm build

      - name: Validate Cloudflare Build Output without uploading
        run: pnpm exec cf deploy --prebuilt --dry-run

      - name: Run postbuild Nimbus checks
        run: pnpm exec nimbus-docs check --json

name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/re-lint.yml

  test:
    name: Test
    uses: ./.github/workflows/re-test.yml

  build:
    name: Build
    needs: [lint, test]
    uses: ./.github/workflows/re-build.yml

  usability:
    name: Usability
    needs: [build]
    uses: ./.github/workflows/re-usability.yml
